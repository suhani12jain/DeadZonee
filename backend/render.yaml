services:
  - type: web
    name: deadzero-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false          # set manually in Render dashboard
      - key: DB_NAME
        value: deadzone01
      - key: ANTHROPIC_KEY
        sync: false          # set manually in Render dashboard
      - key: EXPORTS_DIR
        value: ./exports
